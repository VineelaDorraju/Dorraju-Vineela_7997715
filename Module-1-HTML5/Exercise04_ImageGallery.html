<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }
        body{
            background-color:#f4f7fb;
            padding:40px;
            text-align:center;
        }

        h2{
            color:#1565c0;
            margin-bottom:30px;
            font-size:36px;
        }

        table{
            margin:auto;
            border-collapse:collapse;
        }

        td{
            padding:20px;
        }

        .card{
            background-color:white;
            padding:15px;
            border-radius:15px;
            box-shadow:0px 4px 12px rgba(0,0,0,0.15);
        }

        .galleryImage{
            width:220px;
            height:160px;
            border-radius:12px;
            border:4px solid #1565c0;
            transition:0.3s;
        }

        .galleryImage:hover{
            transform:scale(1.05);
        }

        p{
            margin-top:12px;
            font-size:18px;
            font-weight:bold;
            color:#333;
        }

    </style>

</head>

<body>

    <h2>Community Events Gallery</h2>

    <table>

        <tr>

            <td>
                <div class="card">

                    <img src="https://images.unsplash.com/photo-1501386761578-eac5c94b800a?q=80&w=1200&auto=format&fit=crop"
                    alt="Music Event"
                    title="Music Event"
                    class="galleryImage">

                    <p>Music Event</p>

                </div>
            </td>

            <td>
                <div class="card">

                    <img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?q=80&w=1200&auto=format&fit=crop"
                    alt="Sports Event"
                    title="Sports Event"
                    class="galleryImage">

                    <p>Sports Event</p>

                </div>
            </td>

            <td>
                <div class="card">

                    <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop"
                    alt="Workshop"
                    title="Workshop"
                    class="galleryImage">

                    <p>Workshop</p>

                </div>
            </td>

        </tr>

        <tr>

            <td>
                <div class="card">

                    <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=1200&auto=format&fit=crop"
                    alt="Festival"
                    title="Festival"
                    class="galleryImage">

                    <p>Festival</p>

                </div>
            </td>

            <td>
                <div class="card">

                    <img src="https://images.unsplash.com/photo-1511578314322-379afb476865?q=80&w=1200&auto=format&fit=crop"
                    alt="Seminar"
                    title="Seminar"
                    class="galleryImage">

                    <p>Seminar</p>

                </div>
            </td>

            <td>
                <div class="card">

                    <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?q=80&w=1200&auto=format&fit=crop"
                    alt="Community Meet"
                    title="Community Meet"
                    class="galleryImage">

                    <p>Community Meet</p>

                </div>
            </td>

        </tr>

    </table>

</body>

</html>
