<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Portal</title>

    <style>

        body{
            background-color:lightblue;
            font-family:Comic Sans MS;
            margin:0;
            text-align:center;
        }

        nav{
            background-color:purple;
            padding:15px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:15px;
            font-size:20px;
        }

        h1{
            color:darkblue;
            margin-top:30px;
            font-size:40px;
        }

        p{
            font-size:20px;
            color:black;
        }

        .btn{
            background-color:orange;
            color:white;
            border:none;
            padding:10px 20px;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
        }

        .btn:hover{
            background-color:red;
        }

        .events{
            margin-top:40px;
        }

        .card{
            background-color:white;
            border:3px solid blue;
            width:220px;
            padding:20px;
            margin:20px;
            display:inline-block;
            border-radius:20px;
        }

        .card h3{
            color:green;
        }

        footer{
            background-color:purple;
            color:white;
            padding:15px;
            margin-top:40px;
            font-size:18px;
        }

    </style>

</head>

<body>

    <nav>

        <a href="#">Home</a>

        <a href="#">Events</a>

        <a href="#">Register</a>

        <a href="#">Contact</a>

    </nav>

    <h1>Welcome to Community Portal</h1>

    <p>
        This website helps people join fun community events!
    </p>

    <button class="btn">
        Explore Events
    </button>

    <div class="events">

        <div class="card">

            <h3>Food Festival</h3>

            <p>
                Eat tasty food and enjoy games.
            </p>

            <button class="btn">
                Join
            </button>

        </div>

        <div class="card">

            <h3>Music Night</h3>

            <p>
                Listen to songs and dance with friends.
            </p>

            <button class="btn">
                Join
            </button>

        </div>

        <div class="card">

            <h3>Tree Plantation</h3>

            <p>
                Plant trees and help nature stay green.
            </p>

            <button class="btn">
                Join
            </button>

        </div>

    </div>

    <footer>

        ©2026 Community Portal

    </footer>

</body>

</html>
